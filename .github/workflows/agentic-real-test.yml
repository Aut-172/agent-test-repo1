name: Agentic Real Test

on:
  push:
    branches:
      - "codex/agentic-real-*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify industrial fixture
        run: mvn --batch-mode --no-transfer-progress verify
